name: Daily Instagram post

on:
  schedule:
    # Bot o'zini o'zi uzluksiz qayta ishga tushiradi (bot/main.py: dispatch_next).
    # Bu jadval faqat zaxira: zanjir uzilib qolsa, botni qayta tiklaydi.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      post_date:
        description: "Sana (YYYY-MM-DD). Bo'sh qoldirilsa — bot o'zi tanlaydi (21:30 dan keyin ertangi post)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # PAUSE fayli bo'lsa, bot to'xtatilgan: hech narsa o'rnatilmaydi va ishga tushmaydi
      - uses: actions/setup-python@v5
        if: hashFiles('PAUSE') == ''
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: hashFiles('PAUSE') == ''
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code

      - name: Git identity
        if: hashFiles('PAUSE') == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run bot
        if: hashFiles('PAUSE') == ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_DATE: ${{ inputs.post_date }}
          PUBLISH_AT: "18:30"
          BUDGET_MINUTES: "340"
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m bot.main
