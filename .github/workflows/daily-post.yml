name: Daily Instagram post

on:
  schedule:
    # 09:40 Toshkent (04:40 UTC): post tayyorlanadi, soat 10:00 da Telegram'ga yuboriladi
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      post_date:
        description: "Sana (YYYY-MM-DD). Bo'sh qoldirilsa — bugun"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter fonts-dejavu-core
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run bot
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_DATE: ${{ inputs.post_date }}
          SEND_AT: ${{ github.event_name == 'schedule' && '10:00' || '' }}
          DEADLINE_MINUTES: "330"
        run: python -m bot.main
