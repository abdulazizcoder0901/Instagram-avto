name: Daily Instagram post

on:
  schedule:
    # 21:35 Toshkent (16:35 UTC): ertangi post tayyorlanadi, soat 22:00 da Telegram'ga yuboriladi
    - cron: "35 16 * * *"
    # 08:00 Toshkent (03:00 UTC): kechqurun tasdiqlanmagan bo'lsa qayta yuboriladi;
    # tasdiqlangan bo'lsa post chiqquncha /repair kutiladi
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      post_date:
        description: "Sana (YYYY-MM-DD). Bo'sh qoldirilsa — 18:00 dan keyin ertangi, oldin bugungi"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run bot
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_DATE: ${{ inputs.post_date }}
          SEND_AT: ${{ github.event.schedule == '35 16 * * *' && '22:00' || '' }}
          DEADLINE_MINUTES: "330"
        run: python -m bot.main
